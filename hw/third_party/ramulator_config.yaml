Frontend:
  impl: GEM5  

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1

  DRAM:
    impl: DDR4
    org:
      preset: DDR4_8Gb_x8
      channel_width: 64
    timing:
      preset: DDR4_2400R

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RowPolicy:
      impl: OpenRowPolicy
    RefreshManager:
      impl: AllBank
    plugins:
      - ControllerPlugin:
          impl: TraceRecorder
          path: ./trace/dram.trace

  AddrMapper:
    impl: RoBaRaCoCh
    # impl: ChRaBaRoCo
    # impl: MOP4CLXOR
